# Top-level nginx configuration, ours rather than the distribution's.
#
# This file exists because the image no longer derives from nginxinc/nginx-unprivileged. That
# base supplied a main config already adjusted for a non-root user; building on plain alpine
# means supplying it here, where it can be read.
#
# Alpine's own /etc/nginx/nginx.conf cannot be used unchanged: it opens with `user nginx;`, which
# a non-root master process cannot apply, writes its error log to /var/log/nginx/error.log rather
# than to the container's stderr, and leaves the pid and temp paths under directories only root
# can write. Patching those four things with sed at build time would work and would be invisible
# at review; this is the same thing written down.

worker_processes auto;

# To the container's own streams, so `podman logs` works and nothing accumulates on a writable
# layer inside the image.
error_log /dev/stderr warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    # Compiled defaults point these at /var/lib/nginx/tmp, which uid 100 cannot write. nginx
    # fails at start-up rather than at first use, so getting this wrong is at least loud.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # Alpine's layout: http.d, not conf.d. The server block lives in default.conf.
    include /etc/nginx/http.d/*.conf;
}
